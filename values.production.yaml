global:
  environment: production
  domain: frankenphp.99linesofcode.nl
  issuer:
    name: cloudflare-dns01-issuer

# Production: Cloudflare DNS-01 for TLS
issuers:
  selfSigned:
    enabled: false
  localCA:
    enabled: false
  cloudflare:
    enabled: true

# Cloudflare DNS-01 configuration (token provided via --set or external secret)
cloudflare:
  apiToken: ""
  email: 99linesofcode@gmail.com

# Enable PostgreSQL in production with persistence
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 10Gi

# FrankenPHP: production image with baked code, no hostPath
frankenphp:
  image:
    repository: ghcr.io/99linesofcode/frankenphp
    tag: v1.0.0
    pullPolicy: IfNotPresent
  database:
    enabled: true
