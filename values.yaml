# Shared across all subcharts — subcharts reference these via .Values.global
global:
  environment: local
  gateway:
    name: traefik-gateway
    namespace: default
  domain: frankenphp.99linesofcode.test
  issuer:
    name: local-ca-issuer

# --- Issuer toggles (enabled per environment via values overrides) ---
issuers:
  selfSigned:
    enabled: true
  localCA:
    enabled: true
  cloudflare:
    enabled: false

# --- Traefik (Gateway controller) ---
traefik:
  gateway:
    name: traefik-gateway
    namespace: default
    listeners:
      web:
        port: 80
        protocol: HTTP
      websecure:
        port: 443
        protocol: HTTPS
        certificateRefs:
          - name: frankenphp-tls
  hostNetwork: true
  service:
    enabled: false
  providers:
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false
  ports:
    web:
      port: 80
    websecure:
      port: 443

# --- cert-manager ---
cert-manager:
  installCRDs: true
  startupapicheck:
    enabled: false

# --- PostgreSQL (Phase 2) ---
# Disabled by default; enabled per-environment via values.local.yaml / values.production.yaml
postgresql:
  enabled: false
  auth:
    username: laravel
    database: laravel
    # password: "" — set in environment overrides or via --set

# --- FrankenPHP app subchart ---
frankenphp:
  namespace: default
  image:
    repository: dunglas/frankenphp
    tag: php8.5-alpine
    pullPolicy: IfNotPresent
  service:
    port: 80
  host: localhost
  # hostPath: "" — set in values.local.yaml for local dev volume mount
  # database.enabled: set to true in environment overrides when postgresql is enabled
  database:
    enabled: false
