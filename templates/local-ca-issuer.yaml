{{- if .Values.issuers.localCA.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frankenphp-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: frankenphp-local-ca
  secretName: frankenphp-ca-secret
  issuerRef:
    name: self-signed-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca-issuer
spec:
  ca:
    secretName: frankenphp-ca-secret
{{- end }}
