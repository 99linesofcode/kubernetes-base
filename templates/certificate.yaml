apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frankenphp-cert
  namespace: {{ .Values.global.gateway.namespace }}
spec:
  commonName: {{ .Values.global.domain }}
  dnsNames:
    - {{ .Values.global.domain }}
  secretName: frankenphp-tls
  issuerRef:
    {{- if eq .Values.global.environment "local" }}
    name: local-ca-issuer
    {{- else }}
    name: cloudflare-dns01-issuer
    {{- end }}
    kind: ClusterIssuer
