{{- if .Values.issuers.cloudflare.enabled }}
# The cloudflare-api-token Secret is created from the SOPS-encrypted file at
# secrets/production/cloudflare-api-token.yaml. Flux decrypts it in-cluster
# via the Kustomization's decryption block (provider: sops).
# Do NOT create the Secret here — that would overwrite the decrypted value
# with the empty placeholder in values.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-dns01-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.cloudflare.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
{{- end }}

