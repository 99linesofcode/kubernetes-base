apiVersion: v2
name: laravel-stack
version: 0.1.0
dependencies:
  # Gateway controller — creates Gateway, GatewayClass, handles routing
  - name: traefik
    version: 36.2.0
    repository: https://traefik.github.io/charts

  # TLS certificate management — issues certs for Gateway HTTPS listener
  - name: cert-manager
    version: 1.17.2
    repository: https://charts.jetstack.io

  # PostgreSQL database (conditional — enabled via postgresql.enabled)
  - name: postgresql
    version: 16.7.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  # Redis cache/queue (conditional — enabled via redis.enabled)
  - name: redis
    version: 27.0.18
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  # FrankenPHP application (local subchart, vendored from kubernetes-php)
  - name: frankenphp
    version: 0.1.0
    repository: "file://charts/frankenphp"
