apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-deployment"
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-{{ .Chart.Name }}-pod"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-{{ .Chart.Name }}-pod"
    spec:
      containers:
        - name: "{{ .Release.Name }}-{{ .Chart.Name }}-pod"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          env:
            - name: SERVER_NAME
              value: {{ .Values.host | quote }}
            - name: FRANKENPHP_CONFIG
              value: "worker /app/public/index.php"
          {{- if .Values.hostPath }}
          volumeMounts:
            - name: app-code
              mountPath: /app
          {{- end }}
      {{- if .Values.hostPath }}
      volumes:
        - name: app-code
          hostPath:
            path: {{ .Values.hostPath }}
            type: Directory
      {{- end }}
