apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-{{ .Chart.Name }}-service"
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: "{{ .Release.Name }}-{{ .Chart.Name }}-pod"
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
