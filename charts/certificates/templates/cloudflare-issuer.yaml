{{- if .Values.issuers.cloudflare.enabled }}
# Let's Encrypt via a Cloudflare DNS-01 challenge. The API token Secret is
# created out of band (SOPS-encrypted, decrypted by Flux) — not here.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-dns01-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.cloudflare.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
{{- end }}
